    <text xml:space="preserve" style="font-size:26.6667px;line-height:1.25;font-family:'CC Wild Words';-inkscape-font-specification:'CC Wild Words';text-align:center;letter-spacing:2px;text-anchor:middle;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none" x="-12.443336" y="1223.8031" id="text15063"><tspan sodipodi:role="line" id="tspan15061" x="-12.443336" y="1223.8031" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    Hoarders can get piles of money,</tspan><tspan sodipodi:role="line" x="-12.443336" y="1257.1365" id="tspan15065" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    That is true, hackers, that is true.</tspan><tspan sodipodi:role="line" x="-12.443336" y="1290.4698" id="tspan15067" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    But they cannot help their neighbors;</tspan><tspan sodipodi:role="line" x="-12.443336" y="1323.8032" id="tspan15069" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    That's not good, hackers, that's not good.</tspan><tspan sodipodi:role="line" x="-12.443336" y="1357.1366" id="tspan15071" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers"/><tspan sodipodi:role="line" x="-12.443336" y="1390.47" id="tspan15073" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    When we have enough free software</tspan><tspan sodipodi:role="line" x="-12.443336" y="1423.8033" id="tspan15075" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    At our call, hackers, at our call,</tspan><tspan sodipodi:role="line" x="-12.443336" y="1457.1367" id="tspan15077" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    We'll kick out those dirty licenses</tspan><tspan sodipodi:role="line" x="-12.443336" y="1490.4701" id="tspan15079" style="font-size:26.6667px;text-align:start;text-anchor:start;stroke:#ffffff;stroke-width:6;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1;paint-order:stroke fill markers">    Ever more, hackers, ever more.</tspan></text>
